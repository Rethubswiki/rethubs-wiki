name: Publish approved Rethubs Wiki pages

on:
  push:
    branches: [main]
    paths:
      - "wiki-source/**"
      - ".github/workflows/publish-wiki.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-approved-pages:
    name: Publish merged documentation to the Wiki
    runs-on: ubuntu-latest
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@v4

      - name: Publish pages from the approved source
        env:
          WIKI_TOKEN: ${{ secrets.WIKI_PUBLISH_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${WIKI_TOKEN}" ]; then
            echo "WIKI_PUBLISH_TOKEN is required to publish the approved source."
            exit 1
          fi
          git clone "https://x-access-token:${WIKI_TOKEN}@github.com/${REPOSITORY}.wiki.git" wiki
          cp wiki-source/*.md wiki/
          cd wiki
          git config user.name "rethubs-wiki-publisher[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            echo "No approved Wiki content changed."
            exit 0
          fi
          git commit -m "docs(wiki): publish approved source ${SOURCE_SHA}"
          git push origin HEAD
